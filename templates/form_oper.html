<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Справочник операторов</title>
  <style>
    body{font-family:system-ui;padding:20px;background:#f4f6f8;}
    .box{background:#fff;padding:20px;border-radius:8px;max-width:600px;margin:0 auto;}
    input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:4px;}
    button{padding:10px 16px;background:#0a58ca;color:#fff;border:none;border-radius:4px;cursor:pointer;}
    .msg{margin-top:10px;padding:8px;background:#e9ecef;border-radius:4px;display:none;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Добавить оператора</h2>
    <input id="oper_id" placeholder="ID (например 01)">
    <input id="role" placeholder="Роль (гость, кассир, кухня, админ)">
    <input id="first_name" placeholder="Имя/Стол/Обозначение">
    <input id="last_name" placeholder="Фамилия/Номер/Значение">
    <button onclick="saveOper()">Сохранить</button>
    <div id="res" class="msg"></div>
  </div>
  <script>
    async function saveOper(){
      const d=[document.getElementById('oper_id').value,document.getElementById('first_name').value,document.getElementById('last_name').value,document.getElementById('role').value,'QR'].join('*');
      const blob=new Blob([d],{type:'text/plain;charset=utf-8'});
      const fd=new FormData();fd.append('file',blob,`menu-${new Date().toISOString().slice(0,10)}.txt`);
      document.getElementById('res').style.display='block';
      document.getElementById('res').textContent='Отправка...';
      try{
        const r=await fetch('/api/upload/oper',{method:'POST',body:fd});
        document.getElementById('res').textContent='Готово. Запустите обновление справочника или дождитесь следующей синхронизации.';
      }catch(e){document.getElementById('res').textContent='Ошибка: '+e.message;}
    }
  </script>
</body>
</html>
